# Site settings
theme: lagrange
title: "Overthinker's Thoughts"
description: "on software design, artificial intelligence, and socio-technical systems."
url: "https://blog.heusingfeld.de"
baseurl: ""
author: "Alexander Heusingfeld"
repository: "aheusingfeld/aheusingfeld.github.io"
locale: "en"
timezone: "Europe/Berlin"
date_format: "%Y-%m-%d"

# Lagrange templates use {{ site.github.url }} for all paths.
# Empty string makes all URLs root-relative (works locally and in production).
github:
  url: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

paginate: 5
paginate_path: "/page:num/"

plugins:
  - jekyll-asciidoc
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# AsciiDoc support (needed for .adoc/.asciidoc posts)
asciidoc: {}
asciidoctor:
  base_dir: :docdir
  safe: unsafe
  compact: true
  attributes:
    - idprefix=''
    - idseparator=_
    - source-highlighter=coderay
    - icons=font

# Markdown processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Post defaults
defaults:
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post

# Reading files
include:
  - .htaccess
  - _pages
  - _posts
exclude:
  - vendor
  - .bundle
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
