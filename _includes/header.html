<header class="header">
  <h3 class="header-title">
    <div class="header-text">
      <a href="{{ site.github.url }}/">{{ site.title }}</a>
      <small class="header-subtitle">{{ site.description }}</small>
    </div>
    <a href="{{ site.github.url }}/about.html" class="header-portrait-link">
      <img class="header-portrait" src="{{ site.github.url }}/gfx/alex-blog.jpg" alt="{{ site.author }}">
    </a>
    {% include menu.html %}
  </h3>
</header>
